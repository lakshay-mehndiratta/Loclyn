<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loclyn</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Loclyn</h1>
    <span id="connection-indicator" class="status-dot status-unknown"></span>
    <span id="connection-label">Connecting…</span>
  </header>

  <main class="grid">
    <section class="panel panel-wide" id="connection-panel">
      <h2>Connection</h2>
      <div class="connection-summary">
        <div class="device-url-block">
          <span class="field-label">Device URL</span>
          <span id="device-url">Not connected</span>
        </div>
        <div class="connection-fields">
          <div class="field">
            <span class="field-label">Tunnel</span>
            <span id="tunnel-status"><span class="status-dot status-unknown"></span> —</span>
          </div>
          <div class="field">
            <span class="field-label">Proxy</span>
            <span id="proxy-status"><span class="status-dot status-unknown"></span> —</span>
          </div>
          <div class="field">
            <span class="field-label">SSL</span>
            <span id="ssl-status"><span class="status-dot status-unknown"></span> —</span>
          </div>
          <div class="field">
            <span class="field-label">Uptime</span>
            <span id="uptime">—</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Services</h2>
      <table id="services-table">
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Diagnostics</h2>
      <table id="diagnostics-table">
        <tbody></tbody>
      </table>
    </section>

    <section class="panel panel-wide">
      <h2>Recent Requests</h2>
      <table id="requests-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Method</th>
            <th>Path</th>
            <th>Status</th>
            <th>Service</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
